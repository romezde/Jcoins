<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/jcoin.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JCoins" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JCoins</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const recoveryKey = "jcoins_boot_recovery";
        const showRecovery = () => {
          const root = document.getElementById("root");
          if (!root) return;
          root.innerHTML = `
            <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#0f172a;color:#f8fafc;font-family:system-ui,sans-serif">
              <section style="width:min(100%,460px);padding:24px;border:1px solid #334155;border-radius:8px;background:#111c33">
                <h1 style="margin:0 0 12px;font-size:24px">JCoins needs to reload</h1>
                <p style="margin:0 0 20px;line-height:1.5;color:#cbd5e1">An outdated app file stopped the page from loading. Your JCoins data is safe.</p>
                <button id="jcoins-repair-button" type="button" style="width:100%;padding:12px;border:0;border-radius:6px;background:#fbbf24;color:#111827;font-weight:700">Repair and Reload</button>
              </section>
            </main>`;
          document.getElementById("jcoins-repair-button")?.addEventListener("click", () => {
            sessionStorage.removeItem(recoveryKey);
            repair();
          });
        };
        const repair = async () => {
          if (sessionStorage.getItem(recoveryKey) === "1") {
            showRecovery();
            return;
          }
          sessionStorage.setItem(recoveryKey, "1");
          try {
            if ("caches" in window) {
              const keys = await caches.keys();
              await Promise.all(keys.filter((key) => key.startsWith("jcoins-shell-")).map((key) => caches.delete(key)));
            }
            if ("serviceWorker" in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map((registration) => registration.unregister()));
            }
          } catch {}
          const url = new URL(window.location.href);
          url.searchParams.set("recovered", Date.now());
          window.location.replace(url);
        };
        window.addEventListener("error", (event) => {
          const message = String(event.message || "");
          if (event.target?.tagName === "SCRIPT" || /module script|loading chunk|dynamically imported module/i.test(message)) repair();
        }, true);
        window.addEventListener("unhandledrejection", (event) => {
          if (/failed to fetch|loading chunk|dynamically imported module/i.test(String(event.reason?.message || event.reason || ""))) repair();
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
